<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Broadcast Lower Third & Leaderboard Overlay</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Lower Third Styling */
    #lower-third {
      position: absolute;
      bottom: 50px;
      left: 50px;
      display: flex;
      align-items: stretch;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #lower-third.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .lt-accent {
      width: 10px;
      background: #2ec4b6;
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
    }

    .lt-body {
      background: rgba(18, 18, 18, 0.92);
      border: 1px solid #333333;
      border-left: none;
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
      padding: 16px 28px;
      color: #ffffff;
      min-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    .lt-vehicle {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .lt-driver {
      font-size: 18px;
      color: #aaaaaa;
      margin-top: 4px;
      font-weight: 500;
    }

    .lt-distance {
      font-size: 22px;
      font-weight: 700;
      color: #2ec4b6;
      margin-top: 8px;
      display: none;
    }

    /* Leaderboard Styling */
    #leaderboard {
      position: absolute;
      top: 50px;
      right: 50px;
      width: 380px;
      background: rgba(18, 18, 18, 0.95);
      border: 1px solid #333333;
      border-radius: 8px;
      overflow: hidden;
      color: #ffffff;
      opacity: 0;
      transform: translateX(30px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
    }
    #leaderboard.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .lb-header {
      background: #35558F;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #2ec4b6;
      text-align: center;
    }

    .lb-row {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid #2a2a2a;
    }
    .lb-row:last-child {
      border-bottom: none;
    }

    .lb-rank {
      font-size: 20px;
      font-weight: 800;
      color: #2ec4b6;
      width: 40px;
      text-align: center;
    }

    .lb-details {
      flex-grow: 1;
      text-align: center;
    }

    .lb-vehicle {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .lb-driver {
      font-size: 13px;
      color: #aaaaaa;
    }

    .lb-distance {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Lower Third Banner -->
  <div id="lower-third">
    <div class="lt-accent"></div>
    <div class="lt-body">
      <div id="vehicleName" class="lt-vehicle"></div>
      <div id="driverDetails" class="lt-driver"></div>
      <div id="distance" class="lt-distance"></div>
    </div>
  </div>

  <!-- Leaderboard Table Overlay -->
  <div id="leaderboard">
    <div id="lbTitle" class="lb-header">TOP 5 RESULTS</div>
    <div id="lb-rows"></div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const channelName = urlParams.get('channel') || 'pulling_event_default_channel';
  const topic = `smog_media_pulling/${channelName}/control`;

  const lowerThird = document.getElementById('lower-third');
  const leaderboard = document.getElementById('leaderboard');
  const distanceEl = document.getElementById('distance');

  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
    clientId: 'obs_overlay_' + Math.random().toString(16).substr(2, 8)
  });

  client.on('connect', () => {
    client.subscribe(topic);
  });

  client.on('message', (t, message) => {
    try {
      const data = JSON.parse(message.toString());
      const { type, payload, visible, classHeader } = data;

      if (type === 'UPDATE_PULLER') {
        leaderboard.classList.remove('visible');

        const vName = payload.vehicle ? payload.vehicle.toUpperCase().replace(/^["']|["']$/g, '').trim() : '';
        document.getElementById('vehicleName').innerText = vName;

        let driverText = payload.driver ? payload.driver.toUpperCase() : '';
        if (payload.hometown) {
          driverText += ` — ${payload.hometown.toUpperCase()}`;
        }
        
        const driverEl = document.getElementById('driverDetails');
        if (driverText) {
          driverEl.innerText = driverText;
          driverEl.style.display = 'block';
        } else {
          driverEl.style.display = 'none';
        }

        const distVal = payload.distance !== null && payload.distance !== undefined ? String(payload.distance).trim() : '';
        
        if (distVal !== '' && distVal !== '0') {
          distanceEl.innerText = `${distVal} FT`;
          distanceEl.style.display = 'block';
        } else {
          distanceEl.innerText = '';
          distanceEl.style.display = 'none';
        }
      }

      if (type === 'TOGGLE_VISIBILITY') {
        if (visible) {
          leaderboard.classList.remove('visible');
          lowerThird.classList.add('visible');
        } else {
          lowerThird.classList.remove('visible');
        }
      }

      if (type === 'UPDATE_LEADERBOARD') {
        lowerThird.classList.remove('visible');
        
        const lbTitle = document.getElementById('lbTitle');
        const headerLabel = classHeader ? classHeader.toUpperCase().trim() : 'TOP 5';
        lbTitle.innerText = `${headerLabel} RESULTS`;

        const lbRows = document.getElementById('lb-rows');
        lbRows.innerHTML = '';

        payload.forEach((p, idx) => {
          const distNum = parseFloat(p.distance);
          const distDisplay = isNaN(distNum) ? p.distance : distNum.toFixed(2);
          const cleanVehicle = p.vehicle.toUpperCase().replace(/^["']|["']$/g, '').trim();
          
          const row = document.createElement('div');
          row.className = 'lb-row';
          row.innerHTML = `
            <div class="lb-rank">#${idx + 1}</div>
            <div class="lb-details">
              <div class="lb-vehicle">${cleanVehicle}</div>
              <div class="lb-driver">${p.driver.toUpperCase()}</div>
            </div>
            <div class="lb-distance">${distDisplay} FT</div>
          `;
          lbRows.appendChild(row);
        });

        leaderboard.classList.add('visible');
      }

      if (type === 'HIDE_LEADERBOARD') {
        leaderboard.classList.remove('visible');
      }

    } catch (e) {
      console.error("Failed to parse incoming WS message:", e);
    }
  });
</script>

</body>
</html>
