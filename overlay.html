<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulling Broadcast Overlay</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --primary: #0a1936;
      --accent: #ffffff;
      --dark: #121212;
      --panel-bg: linear-gradient(180deg, rgba(31, 87, 184, 0.96) 0%, rgba(11, 35, 84, 0.98) 100%);
      --text: #ffffff;
      --subtext: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    /* Centered & 200% Scaled Lower Third Container */
    .lower-third-container {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translate(-50%, 30px) scale(2);
      transform-origin: center bottom;
      display: flex;
      align-items: stretch;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .lower-third-container.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(2);
    }

    .lt-content {
      background: var(--panel-bg);
      padding: 14px 28px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      min-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .lt-left-group {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .lt-logo {
      height: 64px;
      width: auto;
      object-fit: contain;
    }

    .lt-info { display: flex; flex-direction: column; }
    
    .lt-vehicle {
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      line-height: 1.1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .lt-driver-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .lt-driver,
    .lt-hometown {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .lt-separator {
      font-size: 18px;
      color: #ffffff;
      opacity: 0.6;
    }

    .lt-right-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .lt-distance-box {
      background: var(--primary);
      padding: 8px 20px;
      border-radius: 6px;
      text-align: center;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
      min-width: 115px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4);
    }

    .lt-distance-val {
      font-size: 31px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .lt-distance-unit {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    
    .puller-rank {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    /* Results Overlay Container */
    .leaderboard-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: rgba(10, 25, 54, 0.90);
      backdrop-filter: blur(18px);
      box-sizing: border-box;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease, width 0.4s ease;
      pointer-events: none;
      z-index: 100;
      width: 52vw; /* Expanded slightly for side-by-side text layout */
      height: 94vh;
      max-height: 94vh;
    }

    .leaderboard-container.two-columns {
      width: 92vw;
    }

    .leaderboard-container.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    /* Header Card */
    .lb-header-card {
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      text-align: center;
      flex-shrink: 0;
    }

    .lb-header-logo-left {
      position: absolute;
      left: 20px;
      height: 58px;
      width: auto;
    }

    .lb-header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lb-header-title {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
      margin: 0;
      line-height: 1.15;
    }

    .lb-header-subtitle {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 2px;
    }

    /* Flexible Grid List Container */
    .lb-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(10, 1fr);
      grid-auto-flow: column;
      gap: 12px 20px;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
    }

    .leaderboard-container.two-columns .lb-list {
      grid-template-columns: 1fr 1fr;
    }

    /* Individual Result Rows */
    .lb-item {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
      height: 100%;
    }

    .lb-left-group {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
    }

    .lb-rank-badge {
      background: var(--primary);
      color: #ffffff;
      font-size: 23px;
      font-weight: 900;
      width: 46px;
      height: 46px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    /* Single Inline Row Container for Vehicle + Driver + Hometown */
    .lb-inline-info {
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-vehicle-name {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .lb-driver-name,
    .lb-hometown {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .lb-inline-separator {
      font-size: 20px;
      color: #ffffff;
      opacity: 0.5;
    }

    .lb-dist-box {
      background: var(--primary);
      padding: 8px 18px;
      border-radius: 6px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .lb-dist-val {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .lb-dist-unit {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Participant Lower Third Overlay -->
  <div id="lowerThird" class="lower-third-container">
    <div class="lt-content">
      <div class="lt-left-group">
        <img src="logo.png" alt="Logo" class="lt-logo" id="overlayLogo">
        <div class="lt-info">
          <div id="pullerVehicle" class="lt-vehicle"></div>
          <div class="lt-driver-row">
            <span id="pullerDriver" class="lt-driver"></span>
            <span id="ltSeparator" class="lt-separator" style="display: none;">•</span>
            <span id="pullerHometown" class="lt-hometown"></span>
          </div>
        </div>
      </div>
      <div id="rightGroup" class="lt-right-group" style="display: none;">
        <div class="lt-distance-box">
          <span id="pullerDistance" class="lt-distance-val"></span>
          <span class="lt-distance-unit">FT</span>
        </div>
        <div id="pullerRank" class="puller-rank" style="display: none;"></div>
      </div>
    </div>
  </div>

  <!-- Vertically Filling Results Overlay -->
  <div id="leaderboard" class="leaderboard-container">
    <div class="lb-header-card">
      <img src="logo.png" alt="Logo" class="lb-header-logo-left">
      <div class="lb-header-content">
        <h1 id="lbHeaderTitle" class="lb-header-title">OFFICIAL RESULTS</h1>
        <div id="lbHeaderSubtitle" class="lb-header-subtitle">CLASS STANDINGS</div>
      </div>
    </div>
    <ul id="lbList" class="lb-list"></ul>
  </div>

<script>
  let client = null;

  const urlParams = new URLSearchParams(window.location.search);
  const channelKey = urlParams.get('channel') || 'pulling_event_default_channel';
  const topic = `smog_media_pulling/${channelKey}/control`;

  function getOrdinalSuffix(i) {
    const j = i % 10, k = i % 100;
    if (j === 1 && k !== 11) return i + "st";
    if (j === 2 && k !== 12) return i + "nd";
    if (j === 3 && k !== 13) return i + "rd";
    return i + "th";
  }

  function connectMQTT() {
    client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'ovl_' + Math.random().toString(16).substr(2, 8)
    });

    client.on('connect', () => {
      console.log(`Overlay connected to channel: ${channelKey}`);
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        handleBroadcastEvent(data);
      } catch (e) {
        console.error("Error parsing MQTT payload:", e);
      }
    });
  }

  function handleBroadcastEvent(data) {
    switch (data.type) {
      case 'UPDATE_PULLER':
        renderLowerThird(data.payload);
        break;
      case 'TOGGLE_VISIBILITY':
        setLowerThirdVisible(data.visible);
        break;
      case 'UPDATE_LEADERBOARD':
        renderLeaderboard(data.classHeader, data.payload);
        setLeaderboardVisible(true);
        break;
      case 'HIDE_LEADERBOARD':
        setLeaderboardVisible(false);
        break;
    }
  }

  function renderLowerThird(payload) {
    document.getElementById('pullerVehicle').innerText = payload.vehicle ? `"${payload.vehicle}"` : '';
    document.getElementById('pullerDriver').innerText = payload.driver ? payload.driver : '';
    
    const hometownEl = document.getElementById('pullerHometown');
    const separatorEl = document.getElementById('ltSeparator');
    
    if (payload.hometown && payload.hometown.trim() !== '') {
      hometownEl.innerText = payload.hometown;
      hometownEl.style.display = 'inline';
      separatorEl.style.display = payload.driver ? 'inline' : 'none';
    } else {
      hometownEl.style.display = 'none';
      separatorEl.style.display = 'none';
    }

    const rightGroup = document.getElementById('rightGroup');
    const distVal = document.getElementById('pullerDistance');
    const rankVal = document.getElementById('pullerRank');

    const numDist = parseFloat(payload.distance);

    if (payload.distance !== null && payload.distance !== undefined && payload.distance !== '' && !isNaN(numDist) && numDist > 0) {
      distVal.innerText = typeof payload.distance === 'number' ? payload.distance.toFixed(2) : payload.distance;
      
      let currentRank = payload.rank || payload.place;

      if (!currentRank) {
        try {
          const savedPullersRaw = localStorage.getItem('smog_pullers_data_v1');
          if (savedPullersRaw) {
            const allPullers = JSON.parse(savedPullersRaw);
            const sortedDistances = allPullers
              .map(p => parseFloat(p.distance))
              .filter(d => !isNaN(d) && d > 0)
              .sort((a, b) => b - a);

            const rankIndex = sortedDistances.indexOf(numDist);
            if (rankIndex !== -1) {
              currentRank = rankIndex + 1;
            }
          }
        } catch(e) {
          console.warn("Storage access restricted:", e);
        }
      }

      if (currentRank) {
        const parsedRank = parseInt(currentRank, 10);
        rankVal.innerText = !isNaN(parsedRank) ? `${getOrdinalSuffix(parsedRank)} Place` : `${currentRank} Place`;
        rankVal.style.display = 'block';
      } else {
        rankVal.style.display = 'none';
      }

      rightGroup.style.display = 'flex';
    } else {
      rightGroup.style.display = 'none';
      rankVal.style.display = 'none';
    }
  }

  function setLowerThirdVisible(visible) {
    const el = document.getElementById('lowerThird');
    if (visible) el.classList.add('visible');
    else el.classList.remove('visible');
  }

  function renderLeaderboard(headerTitle, items) {
    document.getElementById('lbHeaderTitle').innerText = headerTitle ? headerTitle : 'OFFICIAL RESULTS';
    const container = document.getElementById('leaderboard');
    const list = document.getElementById('lbList');
    list.innerHTML = '';

    if (!items || items.length === 0) return;

    if (items.length > 10) {
      container.classList.add('two-columns');
    } else {
      container.classList.remove('two-columns');
    }

    items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'lb-item';
      const formattedDist = typeof item.distance === 'number' ? item.distance.toFixed(2) : item.distance;
      
      const driverHtml = item.driver 
        ? `<span class="lb-inline-separator">•</span><span class="lb-driver-name">${item.driver}</span>` 
        : '';
        
      const hometownHtml = item.hometown 
        ? `<span class="lb-inline-separator">•</span><span class="lb-hometown">${item.hometown}</span>` 
        : '';

      li.innerHTML = `
        <div class="lb-left-group">
          <div class="lb-rank-badge">#${idx + 1}</div>
          <div class="lb-inline-info">
            <span class="lb-vehicle-name">"${item.vehicle}"</span>
            ${driverHtml}
            ${hometownHtml}
          </div>
        </div>
        <div class="lb-dist-box">
          <span class="lb-dist-val">${formattedDist}</span>
          <span class="lb-dist-unit">FT</span>
        </div>
      `;
      list.appendChild(li);
    });
  }

  function setLeaderboardVisible(visible) {
    const el = document.getElementById('leaderboard');
    if (visible) el.classList.add('visible');
    else el.classList.remove('visible');
  }

  connectMQTT();
</script>

</body>
</html>
