<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Broadcast Overlay</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Full-Width Rectangular Lower Third */
    #lower-third {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100vw;
      box-sizing: border-box;
      padding: 16px 60px;
      background: linear-gradient(to bottom, #35558F, #1c3054);
      border-top: 3px solid rgba(255, 255, 255, 0.2);
      border-bottom: 3px solid rgba(0, 0, 0, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      
      display: flex;
      justify-content: space-between;
      align-items: center;

      opacity: 0;
      transform: translateY(100%);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #lower-third.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .info-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Vehicle Name (Top, Larger) */
    .vehicle-info {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Driver Name & Hometown (Bottom) */
    .driver-info {
      font-size: 24px;
      font-weight: 500;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.95;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Distance Badge (Right-Aligned) */
    .distance-tag {
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      letter-spacing: 1px;
      display: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* Standings Overlay */
    #leaderboard {
      position: absolute;
      top: 60px;
      right: 60px;
      width: 480px;
      background: rgba(18, 18, 18, 0.95);
      border-radius: 8px;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
      opacity: 0;
      transform: translateX(50px);
      transition: all 0.4s ease-in-out;
    }

    #leaderboard.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .lb-header {
      background: #35558F;
      color: #fff;
      padding: 12px 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid #2a2a2a;
    }

    .lb-rank {
      font-size: 22px;
      font-weight: bold;
      color: #35558F;
      width: 35px;
    }

    .lb-details {
      flex-grow: 1;
      padding-left: 10px;
    }

    .lb-driver {
      font-weight: bold;
      font-size: 16px;
      color: #fff;
    }

    .lb-vehicle {
      font-size: 13px;
      color: #aaa;
    }

    .lb-distance {
      font-size: 22px;
      font-weight: bold;
      color: #2ec4b6;
    }
  </style>
</head>
<body>

  <div id="lower-third">
    <div class="info-container">
      <div class="vehicle-info" id="vehicleName">VEHICLE NAME</div>
      <div class="driver-info" id="driverDetails">DRIVER NAME</div>
    </div>
    <div class="distance-tag" id="distance"></div>
  </div>

  <div id="leaderboard">
    <div class="lb-header">TOP 5 STANDINGS</div>
    <div id="lb-rows"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const channelName = urlParams.get('channel') || 'pulling_event_default_channel';
    const topic = `smog_media_pulling/${channelName}/control`;

    const lowerThird = document.getElementById('lower-third');
    const leaderboard = document.getElementById('leaderboard');
    const distanceEl = document.getElementById('distance');

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'obs_overlay_' + Math.random().toString(16).substr(2, 8)
    });

    client.on('connect', () => {
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        const { type, payload, visible } = data;

        if (type === 'UPDATE_PULLER') {
          leaderboard.classList.remove('visible');

          // Top Line: Vehicle Name
          document.getElementById('vehicleName').innerText = payload.vehicle ? payload.vehicle.toUpperCase() : '';

          // Bottom Line: Driver Name & Hometown
          let driverText = payload.driver ? payload.driver.toUpperCase() : '';
          if (payload.hometown) {
            driverText += ` — ${payload.hometown.toUpperCase()}`;
          }
          document.getElementById('driverDetails').innerText = driverText;

          // Distance logic
          const distVal = payload.distance !== null && payload.distance !== undefined ? String(payload.distance).trim() : '';
          
          if (distVal !== '' && distVal !== '0') {
            distanceEl.innerText = `${distVal} FT`;
            distanceEl.style.display = 'block';
          } else {
            distanceEl.innerText = '';
            distanceEl.style.display = 'none';
          }
        }

        if (type === 'TOGGLE_VISIBILITY') {
          if (visible) {
            leaderboard.classList.remove('visible');
            lowerThird.classList.add('visible');
          } else {
            lowerThird.classList.remove('visible');
          }
        }

        if (type === 'UPDATE_LEADERBOARD') {
          lowerThird.classList.remove('visible');
          
          const lbRows = document.getElementById('lb-rows');
          lbRows.innerHTML = '';

          payload.forEach((p, idx) => {
            const distNum = parseFloat(p.distance);
            const distDisplay = isNaN(distNum) ? p.distance : distNum.toFixed(2);
            
            const row = document.createElement('div');
            row.className = 'lb-row';
            row.innerHTML = `
              <div class="lb-rank">#${idx + 1}</div>
              <div class="lb-details">
                <div class="lb-driver">${p.driver.toUpperCase()}</div>
                <div class="lb-vehicle">${p.vehicle.toUpperCase()}</div>
              </div>
              <div class="lb-distance">${distDisplay} FT</div>
            `;
            lbRows.appendChild(row);
          });

          leaderboard.classList.add('visible');
        }

        if (type === 'HIDE_LEADERBOARD') {
          leaderboard.classList.remove('visible');
        }

      } catch (e) {
        console.error("Failed to parse incoming WS message:", e);
      }
    });
  </script>
</body>
</html>
