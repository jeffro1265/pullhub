<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay</title>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; font-family: 'Arial Black', sans-serif; }
    .lower-third { position: absolute; bottom: 60px; left: 60px; display: flex; background: #1a8cff; color: #fff; border-radius: 8px; opacity: 0; transform: translateY(40px); transition: all 0.4s ease-in-out; overflow: hidden; }
    .lower-third.visible { opacity: 1; transform: translateY(0); }
    .info-block { padding: 16px 28px; display: flex; flex-direction: column; }
    .driver-name { font-size: 30px; text-transform: uppercase; }
    .meta-info { font-size: 16px; font-weight: normal; font-family: sans-serif; opacity: 0.9; margin-top: 4px; }
    .distance-block { background: #005bb5; padding: 16px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 3px solid #fff; }
    .distance-value { font-size: 34px; }
    .distance-label { font-size: 11px; font-family: sans-serif; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="overlay" class="lower-third">
    <div class="info-block">
      <div id="driver" class="driver-name">Driver Name</div>
      <div class="meta-info"><span id="team">Team Name</span> &bull; <span id="town">Hometown</span></div>
    </div>
    <div class="distance-block">
      <div id="distance" class="distance-value">000.00</div>
      <div class="distance-label">Distance</div>
    </div>
  </div>

  <script>
    // Must match the topic string used in index.html
    const CHANNEL_TOPIC = 'mypullingchannel123';
    
    const overlay = document.getElementById('overlay');
    const driverEl = document.getElementById('driver');
    const teamEl = document.getElementById('team');
    const townEl = document.getElementById('town');
    const distanceEl = document.getElementById('distance');

    function connect() {
      const eventSource = new EventSource(`https://ntfy.sh/${CHANNEL_TOPIC}/sse`);
      
      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(JSON.parse(event.data).message);
          if (data.active) {
            driverEl.textContent = data.driver || 'N/A';
            teamEl.textContent = data.team || 'N/A';
            townEl.textContent = data.town || 'N/A';
            distanceEl.textContent = data.distance || '0.00';
            overlay.classList.add('visible');
          } else {
            overlay.classList.remove('visible');
          }
        } catch(e) {}
      };

      eventSource.onerror = () => {
        eventSource.close();
        setTimeout(connect, 2000); // Reconnect if disconnected
      };
    }

    connect();
  </script>
</body>
</html>
