<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulling Broadcast Overlay</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --primary: #121212;
      --accent: #35558F;
      --accent-green: #2ec4b6;
      --text: #ffffff;
      --subtext: #dddddd;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: var(--text);
    }

    #overlay-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 1000px;
    }

    /* Lower Third Base Styling */
    .lower-third {
      display: flex;
      background: rgba(18, 18, 18, 0.92);
      border-left: 8px solid var(--accent);
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      min-height: 90px;
    }

    .lower-third.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .lt-content {
      padding: 15px 25px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Centering Layout for Info & Announcer Graphics */
    .lower-third.centered-info .lt-content {
      align-items: center;
      text-align: center;
      padding: 18px 30px;
    }

    .lt-title {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text);
      line-height: 1.1;
    }

    .lt-subtitle {
      font-size: 20px;
      font-weight: 500;
      color: var(--subtext);
      margin-top: 4px;
    }

    .lt-badge {
      background: var(--accent);
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-green);
      min-width: 160px;
      border-left: 2px solid rgba(255,255,255,0.1);
    }

    /* Leaderboard Standings Overlay - Scaled 50% */
    #leaderboard {
      opacity: 0;
      transform: translateY(30px) scale(0.5);
      transform-origin: bottom left;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      width: 700px;
      background: rgba(18, 18, 18, 0.95);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }

    #leaderboard.visible {
      opacity: 1;
      transform: translateY(0) scale(0.5);
    }

    .lb-header {
      background: var(--accent);
      padding: 12px 20px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
    }

    .lb-table tr {
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .lb-table tr:last-child {
      border-bottom: none;
    }

    .lb-table td {
      padding: 10px 20px;
      font-size: 20px;
    }

    .lb-rank {
      font-weight: 900;
      color: var(--accent-green);
      width: 40px;
    }

    .lb-driver {
      font-weight: 700;
    }

    .lb-vehicle {
      color: var(--subtext);
      font-style: italic;
    }

    .lb-dist {
      text-align: right;
      font-weight: 800;
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div id="overlay-container">
  
  <!-- Single Lower Third Element -->
  <div id="lowerThird" class="lower-third">
    <div class="lt-content">
      <div id="ltTitle" class="lt-title">DRIVER NAME</div>
      <div id="ltSubtitle" class="lt-subtitle">Vehicle Name • Hometown</div>
    </div>
    <div id="ltBadge" class="lt-badge" style="display: none;">
      <span id="ltDist">0.00</span><span style="font-size: 18px; margin-left: 4px;">FT</span>
    </div>
  </div>

  <!-- Standings Leaderboard Element -->
  <div id="leaderboard">
    <div class="lb-header">
      <span id="lbClass">TOP 5 STANDINGS</span>
      <small style="font-size: 14px; opacity: 0.8;">LIVE OFFICIAL</small>
    </div>
    <table class="lb-table">
      <tbody id="lbBody">
        <!-- Dynamic rows inserted via MQTT -->
      </tbody>
    </table>
  </div>

</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const channelKey = urlParams.get('channel') || 'pulling_event_default_channel';
  const topic = `smog_media_pulling/${channelKey}/control`;

  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
    clientId: 'ovl_' + Math.random().toString(16).substr(2, 8)
  });

  const ltBox = document.getElementById('lowerThird');
  const ltTitle = document.getElementById('ltTitle');
  const ltSubtitle = document.getElementById('ltSubtitle');
  const ltBadge = document.getElementById('ltBadge');
  const ltDist = document.getElementById('ltDist');

  const lbBox = document.getElementById('leaderboard');
  const lbClass = document.getElementById('lbClass');
  const lbBody = document.getElementById('lbBody');

  client.on('connect', () => {
    client.subscribe(topic);
  });

  client.on('message', (t, message) => {
    try {
      const data = JSON.parse(message.toString());

      if (data.type === 'UPDATE_PULLER') {
        const p = data.payload;
        
        // Populate graphic content
        ltTitle.innerText = p.vehicle || '';
        ltSubtitle.innerText = p.driver || '';

        // If there is an associated hometown, append it
        if (p.hometown && p.hometown.trim() !== '') {
          ltSubtitle.innerText += ` • ${p.hometown}`;
        }

        // Center layout dynamically for Event Info / Announcer cards (no hometown or distance)
        const isInfoCard = (!p.hometown || p.hometown.trim() === '') && (!p.distance || p.distance == 0);
        
        if (isInfoCard) {
          ltBox.classList.add('centered-info');
        } else {
          ltBox.classList.remove('centered-info');
        }

        // Handle distance badge display
        if (p.distance && p.distance != 0) {
          const num = parseFloat(p.distance);
          ltDist.innerText = isNaN(num) ? p.distance : num.toFixed(2);
          ltBadge.style.display = 'flex';
        } else {
          ltBadge.style.display = 'none';
        }
      }

      if (data.type === 'TOGGLE_VISIBILITY') {
        if (data.visible) {
          lbBox.classList.remove('visible');
          ltBox.classList.add('visible');
        } else {
          ltBox.classList.remove('visible');
        }
      }

      if (data.type === 'UPDATE_LEADERBOARD') {
        lbClass.innerText = `${data.classHeader} RESULTS`;
        lbBody.innerHTML = '';

        if (data.payload && data.payload.length > 0) {
          data.payload.forEach((p, idx) => {
            const tr = document.createElement('tr');
            const distVal = typeof p.distance === 'number' ? p.distance.toFixed(2) : p.distance;
            tr.innerHTML = `
              <td class="lb-rank">#${idx + 1}</td>
              <td class="lb-driver">${p.driver}</td>
              <td class="lb-vehicle">"${p.vehicle}"</td>
              <td class="lb-dist">${distVal} FT</td>
            `;
            lbBody.appendChild(tr);
          });
        }

        ltBox.classList.remove('visible');
        lbBox.classList.add('visible');
      }

      if (data.type === 'HIDE_LEADERBOARD') {
        lbBox.classList.remove('visible');
      }

    } catch (e) {
      console.error("Overlay message parsing error:", e);
    }
  });
</script>

</body>
</html>
