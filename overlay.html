<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulling Broadcast Graphic Overlay</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-dark: rgba(18, 18, 18, 0.92);
      --accent-blue: #35558F;
      --accent-green: #2ec4b6;
      --text-main: #ffffff;
      --text-sub: #cccccc;
      --border-color: #444444;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: var(--text-main);
    }

    /* ==========================================
       1. LOWER THIRD OVERLAY (Bottom Left)
       ========================================== */
    #lowerThird {
      position: absolute;
      bottom: 60px;
      left: 60px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    #lowerThird.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .lt-card {
      background: var(--bg-dark);
      border-left: 8px solid var(--accent-blue);
      border-radius: 0 8px 8px 0;
      padding: 16px 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      min-width: 400px;
      max-width: 700px;
    }

    .lt-title-row {
      display: flex;
      align-items: baseline;
      gap: 15px;
    }

    .lt-primary {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .lt-secondary {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent-green);
    }

    .lt-sub-row {
      font-size: 20px;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 400;
    }

    .lt-distance-badge {
      display: inline-block;
      margin-top: 8px;
      background: var(--accent-green);
      color: #000000;
      font-size: 22px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 4px;
    }


    /* ==========================================
       2. LEADERBOARD OVERLAY (Scaled 50%)
       ========================================== */
    #leaderboardContainer {
      position: absolute;
      top: 50px;
      right: 50px;
      width: 500px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      
      /* --- 50% SCALING APPLIED HERE --- */
      transform: scale(0.5);
      transform-origin: top right;
      transition: opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* When visible, keep scale at 0.5 while fading in */
    #leaderboardContainer.visible {
      opacity: 1;
      transform: scale(0.5) translateY(0);
    }

    .lb-header {
      background: var(--accent-blue);
      color: var(--text-main);
      padding: 16px 20px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
    }

    .lb-table tr {
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .lb-table tr:last-child {
      border-bottom: none;
    }

    .lb-table td {
      padding: 12px 18px;
      font-size: 18px;
    }

    .lb-rank {
      font-weight: 800;
      color: var(--accent-green);
      width: 40px;
      font-size: 20px;
    }

    .lb-details {
      display: flex;
      flex-direction: column;
    }

    .lb-driver {
      font-weight: 700;
      color: var(--text-main);
    }

    .lb-vehicle {
      font-size: 15px;
      color: var(--text-sub);
    }

    .lb-distance {
      text-align: right;
      font-weight: 800;
      color: var(--accent-green);
      white-space: nowrap;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- Lower Third Banner -->
  <div id="lowerThird">
    <div class="lt-card">
      <div class="lt-title-row">
        <span id="ltPrimary" class="lt-primary">---</span>
        <span id="ltSecondary" class="lt-secondary"></span>
      </div>
      <div id="ltSubRow" class="lt-sub-row"></div>
      <div id="ltDistance" class="lt-distance-badge" style="display: none;"></div>
    </div>
  </div>

  <!-- Leaderboard Table Graphic (Scaled to 50%) -->
  <div id="leaderboardContainer">
    <div id="lbHeader" class="lb-header">TOP STANDINGS</div>
    <table class="lb-table">
      <tbody id="lbBody">
        <!-- Rows dynamically injected via MQTT -->
      </tbody>
    </table>
  </div>

<script>
  let client = null;

  // Retrieve channel key from URL parameter (e.g. overlay.html?channel=my_event)
  const urlParams = new URLSearchParams(window.location.search);
  const channelName = urlParams.get('channel') || 'pulling_event_default_channel';
  const topic = `smog_media_pulling/${channelName}/control`;

  function initMQTT() {
    client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'ovl_' + Math.random().toString(16).substr(2, 8)
    });

    client.on('connect', () => {
      console.log('Overlay connected to MQTT topic:', topic);
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        handleBroadcastEvent(data);
      } catch (e) {
        console.error('Error parsing MQTT payload:', e);
      }
    });
  }

  function handleBroadcastEvent(data) {
    switch (data.type) {
      case 'UPDATE_PULLER':
        renderLowerThird(data.payload);
        break;

      case 'TOGGLE_VISIBILITY':
        const lt = document.getElementById('lowerThird');
        if (data.visible) {
          lt.classList.add('visible');
        } else {
          lt.classList.remove('visible');
        }
        break;

      case 'UPDATE_LEADERBOARD':
        renderLeaderboard(data.classHeader, data.payload);
        document.getElementById('leaderboardContainer').classList.add('visible');
        break;

      case 'HIDE_LEADERBOARD':
        document.getElementById('leaderboardContainer').classList.remove('visible');
        break;

      default:
        break;
    }
  }

  function renderLowerThird(payload) {
    if (!payload) return;

    const primary = document.getElementById('ltPrimary');
    const secondary = document.getElementById('ltSecondary');
    const subRow = document.getElementById('ltSubRow');
    const distBadge = document.getElementById('ltDistance');

    // Mapped for standard participants, event info, and announcer lower thirds
    primary.innerText = payload.vehicle || payload.driver || '';
    secondary.innerText = payload.vehicle && payload.driver ? payload.driver : '';
    subRow.innerText = payload.hometown || payload.pullClass || '';

    if (payload.distance && payload.distance !== 'null' && payload.distance !== '0') {
      const formattedDist = typeof payload.distance === 'number' ? payload.distance.toFixed(2) : payload.distance;
      distBadge.innerText = `${formattedDist} FT`;
      distBadge.style.display = 'inline-block';
    } else {
      distBadge.style.display = 'none';
    }
  }

  function renderLeaderboard(headerText, rows) {
    const lbHeader = document.getElementById('lbHeader');
    const lbBody = document.getElementById('lbBody');

    lbHeader.innerText = headerText ? `${headerText} STANDINGS` : 'STANDINGS';
    lbBody.innerHTML = '';

    if (!rows || rows.length === 0) {
      lbBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: var(--text-sub);">No Results Recorded</td></tr>';
      return;
    }

    rows.forEach((row, idx) => {
      const tr = document.createElement('tr');
      const distFormatted = typeof row.distance === 'number' ? row.distance.toFixed(2) : row.distance;

      tr.innerHTML = `
        <td class="lb-rank">#${idx + 1}</td>
        <td>
          <div class="lb-details">
            <span class="lb-driver">${row.driver || 'N/A'}</span>
            <span class="lb-vehicle">"${row.vehicle || 'N/A'}"</span>
          </div>
        </td>
        <td class="lb-distance">${distFormatted} FT</td>
      `;
      lbBody.appendChild(tr);
    });
  }

  initMQTT();
</script>

</body>
</html>
