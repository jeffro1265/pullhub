<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Broadcast Overlay</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Lower Third Banner */
    #lower-third {
      position: absolute;
      bottom: 50px;
      left: 50%;
      width: 50vw;
      min-width: 850px;
      box-sizing: border-box;
      padding: 18px 36px;
      background: linear-gradient(to bottom, #35558F, #1c3054);
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      
      display: flex;
      align-items: center;
      gap: 26px;

      opacity: 0;
      transform: translate(-50%, 60px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #lower-third.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .logo-container {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      height: 105px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
    }

    .info-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .vehicle-info {
      font-size: 45px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
    }

    .driver-info {
      font-size: 27px;
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .distance-tag {
      font-size: 45px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 20px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      text-align: center;
      letter-spacing: 1.5px;
      display: none;
      flex-shrink: 0;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.4);
    }

    /* Centered Standings Leaderboard */
    #leaderboard {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 720px;
      background: linear-gradient(to bottom, #35558F, #1c3054);
      border-radius: 12px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      opacity: 0;
      transform: translate(-50%, -40%);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #leaderboard.visible {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .lb-header {
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
    }

    .lb-header img {
      height: 65px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    .lb-header-text {
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      line-height: 1.1;
    }

    .lb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.1);
    }

    .lb-row:last-child {
      border-bottom: none;
    }

    .lb-rank {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      width: 55px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .lb-details {
      flex-grow: 1;
      padding-left: 10px;
    }

    .lb-driver {
      font-weight: 800;
      font-size: 22px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lb-vehicle {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .lb-distance {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Centered Lower Third Banner -->
  <div id="lower-third">
    <div class="logo-container">
      <img src="logo.png" alt="OSTPA Logo">
    </div>
    <div class="info-container">
      <div class="vehicle-info" id="vehicleName">VEHICLE NAME</div>
      <div class="driver-info" id="driverDetails">DRIVER NAME</div>
    </div>
    <div class="distance-tag" id="distance"></div>
  </div>

  <!-- Centered Standings Leaderboard -->
  <div id="leaderboard">
    <div class="lb-header">
      <img src="logo.png" alt="OSTPA Logo">
      <div class="lb-header-text" id="lbTitle">TOP 5 STANDINGS</div>
    </div>
    <div id="lb-rows"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const channelName = urlParams.get('channel') || 'pulling_event_default_channel';
    const topic = `smog_media_pulling/${channelName}/control`;

    const lowerThird = document.getElementById('lower-third');
    const leaderboard = document.getElementById('leaderboard');
    const distanceEl = document.getElementById('distance');

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'obs_overlay_' + Math.random().toString(16).substr(2, 8)
    });

    client.on('connect', () => {
      client.subscribe(topic);
    });

    client.on('message', (t, message) => {
      try {
        const data = JSON.parse(message.toString());
        const { type, payload, visible, className } = data;

        if (type === 'UPDATE_PULLER') {
          leaderboard.classList.remove('visible');

          document.getElementById('vehicleName').innerText = payload.vehicle ? payload.vehicle.toUpperCase() : '';

          let driverText = payload.driver ? payload.driver.toUpperCase() : '';
          if (payload.hometown) {
            driverText += ` — ${payload.hometown.toUpperCase()}`;
          }
          document.getElementById('driverDetails').innerText = driverText;

          const distVal = payload.distance !== null && payload.distance !== undefined ? String(payload.distance).trim() : '';
          
          if (distVal !== '' && distVal !== '0') {
            distanceEl.innerText = `${distVal} FT`;
            distanceEl.style.display = 'block';
          } else {
            distanceEl.innerText = '';
            distanceEl.style.display = 'none';
          }
        }

        if (type === 'TOGGLE_VISIBILITY') {
          if (visible) {
            leaderboard.classList.remove('visible');
            lowerThird.classList.add('visible');
          } else {
            lowerThird.classList.remove('visible');
          }
        }

        if (type === 'UPDATE_LEADERBOARD') {
          lowerThird.classList.remove('visible');
          
          const lbTitle = document.getElementById('lbTitle');
          if (className && className.trim() !== '') {
            lbTitle.innerText = `${className.toUpperCase()} STANDINGS`;
          } else {
            lbTitle.innerText = 'TOP 5 STANDINGS';
          }

          const lbRows = document.getElementById('lb-rows');
          lbRows.innerHTML = '';

          payload.forEach((p, idx) => {
            const distNum = parseFloat(p.distance);
            const distDisplay = isNaN(distNum) ? p.distance : distNum.toFixed(2);
            
            const row = document.createElement('div');
            row.className = 'lb-row';
            row.innerHTML = `
              <div class="lb-rank">#${idx + 1}</div>
              <div class="lb-details">
                <div class="lb-driver">${p.driver.toUpperCase()}</div>
                <div class="lb-vehicle">${p.vehicle.toUpperCase()}</div>
              </div>
              <div class="lb-distance">${distDisplay} FT</div>
            `;
            lbRows.appendChild(row);
          });

          leaderboard.classList.add('visible');
        }

        if (type === 'HIDE_LEADERBOARD') {
          leaderboard.classList.remove('visible');
        }

      } catch (e) {
        console.error("Failed to parse incoming WS message:", e);
      }
    });
  </script>
</body>
</html>
