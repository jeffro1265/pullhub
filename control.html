<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motorsports Broadcast Control Center</title>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --border-color: #333;
      --accent-color: #2196F3;
      --text-main: #ffffff;
      --text-muted: #aaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    h3 {
      margin-bottom: 15px;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      color: var(--accent-color);
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #121212;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      resize: vertical;
      font-family: monospace;
      margin-bottom: 10px;
    }

    .override-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .field-group label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .field-group input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: #121212;
      color: #fff;
      font-size: 0.95rem;
    }

    .field-group input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.btn-clear {
      background: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .full-width {
      grid-column: span 2;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- TSV Roster Import -->
  <div class="panel">
    <h3>Import TSV Roster</h3>
    <textarea id="tsv-input" placeholder="Paste TSV lines here...&#10;Format per line: Driver [TAB] Vehicle [TAB] Hometown [TAB] Distance"></textarea>
    <div class="actions">
      <button id="btn-import">Import Roster</button>
    </div>
  </div>

  <!-- Manual Override Panel -->
  <div class="panel">
    <h3>Manual Override</h3>
    <div class="override-grid">
      <div class="field-group">
        <label for="override-driver">Driver</label>
        <input type="text" id="override-driver" placeholder="Driver Name">
      </div>
      
      <div class="field-group">
        <label for="override-vehicle">Vehicle</label>
        <input type="text" id="override-vehicle" placeholder="Vehicle / Truck Name">
      </div>

      <div class="field-group">
        <label for="override-hometown">Hometown</label>
        <input type="text" id="override-hometown" placeholder="City, ST">
      </div>

      <div class="field-group">
        <label for="override-distance">Distance</label>
        <input type="text" id="override-distance" placeholder="000.000">
      </div>
    </div>
    
    <div class="actions">
      <button id="btn-apply-override">Apply Override</button>
      <button id="btn-clear-override" class="btn-clear">Clear</button>
    </div>
  </div>

  <!-- Results Panel Table -->
  <div class="panel full-width">
    <h3>Current Results</h3>
    <table id="results-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Driver</th>
          <th>Vehicle</th>
          <th>Hometown</th>
          <th>Distance</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="results-body">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
  </div>

</div>

<script>
  // Initialize BroadcastChannel for cross-window sync
  const channel = new BroadcastChannel('motorsports_overlay_channel');
  let rosterData = [];

  // Parse TSV Roster Input
  // Format expected: Driver \t Vehicle \t Hometown \t Distance
  document.getElementById('btn-import').addEventListener('click', () => {
    const rawText = document.getElementById('tsv-input').value;
    if (!rawText.trim()) return;

    const lines = rawText.trim().split('\n');
    rosterData = lines.map((line) => {
      const [driver, vehicle, hometown, distance] = line.split('\t').map(col => col?.trim() || '');
      return {
        driver: driver || 'N/A',
        vehicle: vehicle || 'N/A',
        hometown: hometown || 'N/A',
        distance: distance || '000.000'
      };
    });

    renderResultsTable();
  });

  // Render Roster in Control Panel Table
  function renderResultsTable() {
    const tbody = document.getElementById('results-body');
    tbody.innerHTML = '';

    rosterData.forEach((item, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${index + 1}</td>
        <td><strong>${item.driver}</strong></td>
        <td>${item.vehicle}</td>
        <td>${item.hometown}</td>
        <td>${item.distance}</td>
        <td><button onclick="sendToOverlay(${index})" style="padding: 4px 8px; font-size: 0.8rem;">Push to Stream</button></td>
      `;
      tbody.appendChild(row);
    });
  }

  // Push specific row from table to overlay
  window.sendToOverlay = function(index) {
    const entry = rosterData[index];
    if (entry) {
      channel.postMessage({ type: 'UPDATE_OVERLAY', data: entry });
    }
  };

  // Apply Manual Override
  document.getElementById('btn-apply-override').addEventListener('click', () => {
    const overrideEntry = {
      driver: document.getElementById('override-driver').value.trim() || 'N/A',
      vehicle: document.getElementById('override-vehicle').value.trim() || 'N/A',
      hometown: document.getElementById('override-hometown').value.trim() || 'N/A',
      distance: document.getElementById('override-distance').value.trim() || '000.000'
    };

    channel.postMessage({ type: 'UPDATE_OVERLAY', data: overrideEntry });
  });

  // Clear Override Inputs
  document.getElementById('btn-clear-override').addEventListener('click', () => {
    document.getElementById('override-driver').value = '';
    document.getElementById('override-vehicle').value = '';
    document.getElementById('override-hometown').value = '';
    document.getElementById('override-distance').value = '';
  });
</script>

</body>
</html>
