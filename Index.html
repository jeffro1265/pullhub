<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tractor Pull Control Panel (Cloud Sync)</title>
  <style>
    body { font-family: sans-serif; background: #18181c; color: #fff; padding: 20px; margin: 0; }
    .container { display: flex; gap: 20px; }
    .panel { background: #23232a; padding: 20px; border-radius: 8px; flex: 1; }
    h2 { margin-top: 0; color: #1a8cff; }
    textarea { width: 100%; height: 100px; background: #141418; color: #00ffcc; border: 1px solid #444; }
    button { background: #1a8cff; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #333; padding: 6px; text-align: left; }
    th { background: #141418; }
    input[type="text"] { width: 95%; background: transparent; border: none; color: #fff; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: #1a8cff; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <h1>Tractor Pull Scorekeeping Control Panel</h1>
  <div class="container">
    <div class="panel" style="max-width: 320px;">
      <h2>Panel 1: Import</h2>
      <textarea id="tsvImport" placeholder="321.45	Iron Maiden	John Doe	Dallas, TX"></textarea>
      <button onclick="parseTSV()">Load Table</button>
    </div>
    <div class="panel">
      <h2>Panel 2: Lower Third Control</h2>
      <table>
        <thead>
          <tr><th>On Air</th><th>Distance</th><th>Team Name</th><th>Driver Name</th><th>Hometown</th></tr>
        </thead>
        <tbody id="pullerTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Unique channel topic name - change 'mypullingchannel123' to any custom secret string
    const CHANNEL_TOPIC = 'mypullingchannel123';
    const tableBody = document.getElementById('pullerTable');

    function createRow(dist = '', team = '', driver = '', town = '', index = 0) {
      return `
        <tr>
          <td><label class="switch"><input type="checkbox" onchange="toggleOverlay(${index})" id="switch-${index}"><span class="slider"></span></label></td>
          <td><input type="text" value="${dist}" oninput="updateData(${index})" id="dist-${index}"></td>
          <td><input type="text" value="${team}" oninput="updateData(${index})" id="team-${index}"></td>
          <td><input type="text" value="${driver}" oninput="updateData(${index})" id="driver-${index}"></td>
          <td><input type="text" value="${town}" oninput="updateData(${index})" id="town-${index}"></td>
        </tr>`;
    }

    function initTable() {
      tableBody.innerHTML = '';
      for (let i = 0; i < 20; i++) tableBody.innerHTML += createRow('', '', '', '', i);
    }

    function parseTSV() {
      const raw = document.getElementById('tsvImport').value.trim();
      if (!raw) return;
      const rows = raw.split('\n');
      tableBody.innerHTML = '';
      for (let i = 0; i < Math.max(20, rows.length); i++) {
        if (rows[i]) {
          const c = rows[i].split('\t');
          tableBody.innerHTML += createRow(c[0]||'', c[1]||'', c[2]||'', c[3]||'', i);
        } else {
          tableBody.innerHTML += createRow('', '', '', '', i);
        }
      }
    }

    function sendToCloud(payload) {
      fetch(`https://ntfy.sh/${CHANNEL_TOPIC}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
    }

    function toggleOverlay(activeIndex) {
      for (let i = 0; i < tableBody.children.length; i++) {
        if (i !== activeIndex) {
          const sw = document.getElementById(`switch-${i}`);
          if (sw) sw.checked = false;
        }
      }
      const activeSwitch = document.getElementById(`switch-${activeIndex}`);
      if (activeSwitch && activeSwitch.checked) {
        sendToCloud({
          active: true,
          distance: document.getElementById(`dist-${activeIndex}`).value,
          team: document.getElementById(`team-${activeIndex}`).value,
          driver: document.getElementById(`driver-${activeIndex}`).value,
          town: document.getElementById(`town-${activeIndex}`).value
        });
      } else {
        sendToCloud({ active: false });
      }
    }

    function updateData(index) {
      const sw = document.getElementById(`switch-${index}`);
      if (sw && sw.checked) toggleOverlay(index);
    }

    initTable();
  </script>
</body>
</html>
